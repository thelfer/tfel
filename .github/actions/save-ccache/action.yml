name: Save ccache
description: >
  Save the compilations cached by the job under the key chosen by setup-ccache, without
  the ones it did not use, so that the cache cannot grow forever.
runs:
  using: composite
  steps:
  - name: Remove the unused compilations
    id: key
    shell: bash
    run: |
      ccache --evict-older-than $(( $(date +%s) - CCACHE_START ))s
      ccache --show-stats
      echo "key=$CCACHE_KEY-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT
  - uses: actions/cache/save@v6
    with:
      path: ${{ runner.temp }}/ccache
      key: ${{ steps.key.outputs.key }}
